<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 목록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>할 일</h1>
      <p class="today" id="today"></p>
    </header>

    <form class="new-todo" id="new-todo-form" autocomplete="off">
      <button type="button" class="toggle-all" id="toggle-all" aria-label="모두 완료 표시" title="모두 완료/해제">✓</button>
      <input id="new-todo" type="text" placeholder="할 일을 입력하고 Enter" aria-label="새 할 일" maxlength="200" autofocus>
      <button type="submit" class="add-btn">추가</button>
    </form>

    <ul class="todo-list" id="todo-list" aria-live="polite"></ul>

    <p class="empty" id="empty">할 일이 없습니다. 위에서 추가해 보세요.</p>

    <footer class="app-footer" id="footer">
      <span id="count"></span>
      <nav class="filters" aria-label="필터">
        <a href="#/" data-filter="all">전체</a>
        <a href="#/active" data-filter="active">진행 중</a>
        <a href="#/completed" data-filter="completed">완료</a>
      </nav>
      <button type="button" class="clear-completed" id="clear-completed">완료 항목 삭제</button>
    </footer>

    <p class="hint">더블클릭으로 수정 · Esc로 취소 · 데이터는 이 브라우저에 저장됩니다</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
